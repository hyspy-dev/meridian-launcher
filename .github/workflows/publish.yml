name: publish

# The launcher is an end-user app (nothing depends on it as a Maven artifact), so publishing =
# attach the runnable shaded jar + a meridian.json descriptor to the GitHub Release. The launcher
# is game-neutral, so its descriptor declares games "*".

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # upload release assets

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      - name: Build the launcher
        run: mvn -B -ntp -DskipTests package

      - name: Attach jar + meridian.json to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(mvn -q -ntp -Dexpression=project.version -DforceStdout help:evaluate)
          JAR=$(ls target/*-shaded.jar | head -1)
          SHA=$(sha256sum "$JAR" | cut -d' ' -f1)
          cat > meridian.json <<EOF
          {
            "kind": "launcher",
            "id": "meridian-launcher",
            "version": "${VERSION}",
            "games": "*",
            "asset": "$(basename "$JAR")",
            "sha256": "${SHA}"
          }
          EOF
          echo "Publishing $(basename "$JAR") to release ${{ github.event.release.tag_name }}"
          gh release upload "${{ github.event.release.tag_name }}" "$JAR" meridian.json --clobber
